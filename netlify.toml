# Netlify build + serve config for the Yureka.One static SPA.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Public site URLs / non-secret config are also hardcoded in SEO, sitemap, and
  # client defaults. Netlify marks all env vars as "secrets" and fails the build
  # when those values appear in the repo — disable that false-positive scan.
  # Real secrets (keys/tokens) must never be committed; see .gitignore.
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_ADMIN_PORTAL_URL,VITE_API_BASE_URL,HUBBLE_API_BASE,HUBBLE_CLIENT_ID,CUELINKS_API_BASE,CUELINKS_OFFERS_PATH,ADMIN_EMAILS,ADMIN_PASSWORD,GMAIL_USER,GMAIL_APP_PASSWORD"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,docs/**,CLAUDE.md,STRUCTURE.md,README.md,public/**,backend/supabase/migrations/**,index.html,.github/**"

# Proxy API calls to the backend (same target as public/.htaccess).
[[redirects]]
  from = "/api/*"
  to = "https://yureka-api.onrender.com/api/:splat"
  status = 200
  force = true

# React Router SPA fallback — every non-asset path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
