# Proxy all API requests to the Render backend
[[redirects]]
  from = "/api/*"
  to = "https://yureka-api.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for Vite-hashed assets (immutable fingerprints)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static public files for 1 day
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
