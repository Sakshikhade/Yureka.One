# Netlify build + serve config for the Yureka.One static SPA.
# Without this, Netlify's auto-detection can pick the wrong build command /
# publish dir, producing a blank page (index.html served, but /assets/*.js
# never built/published).

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the backend (same target as public/.htaccess).
[[redirects]]
  from = "/api/*"
  to = "https://yureka-api.onrender.com/api/:splat"
  status = 200
  force = true

# Explicitly serve static SEO/crawl files — must come BEFORE the SPA catch-all.
# Without these, the /* → /index.html rule intercepts them and Google gets HTML
# instead of XML/text, causing "Couldn't fetch" in Search Console.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200
  force = false

[[redirects]]
  from = "/llms-full.txt"
  to = "/llms-full.txt"
  status = 200
  force = false

# React Router SPA fallback — every non-asset path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
