<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yureka Points - Transfer Calculator</title>
    <meta name="description" content="Calculate points transfers across programs.">
    <link rel="stylesheet" href="styles.css">
    <script src="data.js"></script>
</head>
<body>
    <div class="bg-blobs"></div>

    <div class="container">
        <!-- Top Pill -->
        <div class="top-centered">
            <button class="pill-amber">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                39 Bonus Offers
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>

        <!-- Inputs Framework -->
        <div class="inputs-layout">
                <div class="input-block">
                    <label>Transfer From</label>
                    <div style="position: relative;">
                        <div class="custom-select" id="from-select">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <div class="di-logo" id="from-icon" style="background: transparent;">📋</div>
                                <span class="selected-text" style="color: var(--text-muted)">Any program...</span>
                            </div>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        
                        <!-- Dropdown -->
                        <div class="dropdown-overlay" id="from-dropdown">
                            <div class="dropdown-search-wrapper">
                                <input type="text" id="from-search" autocomplete="off" placeholder="Search programs...">
                            </div>
                            <div class="dropdown-list" id="from-list"></div>
                        </div>
                    </div>
                </div>
                <button class="clear-btn" id="clear-from" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>

            <!-- Transfer To -->
            <div class="input-block">
                <label>Transfer To</label>
                <div style="position: relative;">
                    <div class="custom-select" id="to-select">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div class="di-logo" id="to-icon" style="background: transparent;">🎯</div>
                            <span class="selected-text" style="color: var(--text-muted)">Any program...</span>
                        </div>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <!-- Dropdown -->
                    <div class="dropdown-overlay" id="to-dropdown">
                        <div class="dropdown-search-wrapper">
                            <input type="text" id="to-search" autocomplete="off" placeholder="Search destination...">
                        </div>
                        <div class="dropdown-list" id="to-list"></div>
                    </div>
                </div>
            </div>

            <!-- Points Input -->
            <div class="input-block">
                <label>Transfer Points</label>
                <input type="number" class="number-input" id="points-input" value="10000">
            </div>
        </div>

        <div id="results-area" style="display: none;">
            <!-- Header -->
            <div class="results-header-fw">
                <h2 id="results-count">0 Transfer To Options</h2>
                <div class="actions-pills">
                    <button class="chip-action active-amber">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        Show Bonus Only
                    </button>
                    <button class="chip-action active-blue">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"></path></svg>
                        Show Direct Only
                    </button>
                    <button class="chip-action">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                        Sort by Value
                    </button>
                </div>
            </div>

            <!-- Filter Card -->
            <div class="filter-card">
                <div class="toggles">
                    <span style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1; letter-spacing: 0.05em">TYPE</span>
                    <div class="toggle-item"><div class="dot t-blue"></div> Airlines</div>
                    <div class="toggle-item"><div class="dot t-amber"></div> Hotels</div>
                </div>
                <div class="search-field">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="internal-search" placeholder="Search...">
                </div>
            </div>

            <!-- Results Data -->
            <div class="results-list" id="results-list-container">
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
