    <!-- Optimization: swap display for fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=UnifrakturMaguntia&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
      html {
        scroll-behavior: smooth;
        background-color: #F2EFE9;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #F2EFE9;
        color: #242424;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        user-select: none; /* Security: Disable text selection */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      /* Allow selection on form inputs/textareas only */
      input, textarea, [contenteditable="true"] {
        user-select: text !important;
        -webkit-user-select: text !important;
      }
      
      /* Security: Print Protection */
      @media print {
        body { display: none !important; }
      }

      /* Global Paper Grain Texture */
      .paper-texture {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        opacity: 0.6;
        mix-blend-mode: multiply;
      }

      /* Subtle Vignette for Physical Feel */
      .vignette-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9998;
        background: radial-gradient(circle at 50% 50%, rgba(242, 239, 233, 0) 60%, rgba(220, 215, 205, 0.4) 100%);
        box-shadow: inset 0 0 80px rgba(0,0,0,0.02);
      }

      /* Glass/Vellum Island Effect - Optimized for Readability */
      .glass-panel {
        background: rgba(255, 255, 255, 0.75); 
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5); 
        box-shadow: 
            0 8px 32px 0 rgba(31, 38, 135, 0.05),
            inset 0 0 0 1px rgba(255, 255, 255, 0.2); 
      }

      h1, h2, h3, h4, h5, h6, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      
      .font-blackletter {
        font-family: 'UnifrakturMaguntia', serif;
      }

      /* Custom Selection Color (for inputs) */
      ::selection {
        background: #047857; 
        color: white;
      }

      /* Editorial Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F2EFE9; 
        border-left: 1px solid rgba(0,0,0,0.08);
      }
      ::-webkit-scrollbar-thumb {
        background: #D1CDC4; 
        border: 2px solid #F2EFE9;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #999; 
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: marquee 40s linear infinite;
      }
    </style>
    <script>
      // Security: Disable Right Click
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Security: Disable Keyboard Shortucts for DevTools
      document.addEventListener('keydown', e => {
        // Disable F12
        if (e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        // Disable Ctrl+Shift+I (Inspect)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
          e.preventDefault();
          return false;
        }
        // Disable Ctrl+Shift+J (Console)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
          e.preventDefault();
          return false;
        }
        // Disable Ctrl+Shift+C (Element selector)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
          e.preventDefault();
          return false;
        }
        // Disable Ctrl+U (View Source)
        if (e.ctrlKey && e.keyCode === 85) {
          e.preventDefault();
          return false;
        }
        // Disable Ctrl+S (Save Page)
        if (e.ctrlKey && e.keyCode === 83) {
          e.preventDefault();
          return false;
        }
      });

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#F2EFE9', 
              paper: '#FCFBF8', 
              ink: '#242424',   
              clay: '#047857',  
              teal: '#1A5F54',  
            },
            fontFamily: {
              sans: ['DM Sans', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              blackletter: ['UnifrakturMaguntia', 'serif'],
            },
            animation: {
              'fade-in-up': 'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            perspective: {
              '1000': '1000px',
            }
          }
        }
      }
    </script>
</head>
