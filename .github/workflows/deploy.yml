name: CI / CD

on:
  push:
    branches: [main, feat/java-backend-migration]
  workflow_dispatch:

# Required GitHub Secrets (Settings → Secrets → Actions):
#   SSH_HOST              — VPS IP or hostname
#   SSH_USER              — VPS login user (e.g. root)
#   SSH_PRIVATE_KEY       — private key matching the VPS authorized_keys entry
#   GEMINI_API_KEY        — baked into the frontend bundle at build time
#   VITE_SUPABASE_URL     — baked into the frontend bundle at build time
#   VITE_SUPABASE_ANON_KEY — baked into the frontend bundle at build time
#
# GITHUB_TOKEN is automatic — no setup needed for ghcr.io push.

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.latest_tag }}
          cache-to: type=inline

  deploy:
    name: Deploy to VPS
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/yureka-money/"

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,GH_TOKEN,GH_OWNER
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_OWNER" --password-stdin
            docker pull "$IMAGE"
            cd /opt/yureka-money
            IMAGE="$IMAGE" docker compose up -d --no-build
            docker image prune -f
