name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

  deploy-netlify:
    name: Deploy Netlify
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify production build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${NETLIFY_BUILD_HOOK:-}" ]; then
            echo "Triggering Netlify build hook…"
            curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
            echo
            exit 0
          fi
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && [ -n "${NETLIFY_SITE_ID:-}" ]; then
            echo "Triggering Netlify site build via API…"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"clear_cache":true}' \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds"
            echo
            exit 0
          fi
          echo "::error::Set NETLIFY_BUILD_HOOK or NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID in repo secrets."
          exit 1

  deploy-render:
    name: Deploy Render API
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "Triggering Render deploy hook…"
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo
            exit 0
          fi
          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Triggering Render deploy via API for ${RENDER_SERVICE_ID}…"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}' \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
            echo
            exit 0
          fi
          echo "::error::Set RENDER_DEPLOY_HOOK or RENDER_API_KEY + RENDER_SERVICE_ID in repo secrets."
          exit 1

  smoke:
    name: Smoke checks
    needs: [deploy-netlify, deploy-render]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail
          RENDER_URL="${RENDER_URL:-https://yureka-one.onrender.com}"
          echo "Polling ${RENDER_URL}/api/health …"
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 \
              "${RENDER_URL}/api/health" || echo 000)
            body=$(head -c 200 /tmp/health.json 2>/dev/null || true)
            echo "attempt $i → HTTP $code $body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Render health not green yet — check dashboard logs / Manual Deploy."
          exit 0

      - name: Check Netlify site + API proxy
        env:
          NETLIFY_URL: ${{ vars.NETLIFY_URL }}
        run: |
          set -euo pipefail
          NETLIFY_URL="${NETLIFY_URL:-https://yurekaone.netlify.app}"
          curl -fsS -o /dev/null --max-time 30 "${NETLIFY_URL}/"
          echo "Site OK: ${NETLIFY_URL}/"
          # Proxy may lag while Netlify builds; soft-fail with warning
          code=$(curl -sS -o /tmp/proxy.json -w '%{http_code}' --max-time 45 \
            "${NETLIFY_URL}/api/health" || echo 000)
          echo "Proxy /api/health → HTTP $code $(head -c 160 /tmp/proxy.json 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::warning::Netlify /api proxy not healthy yet (deploy may still be building)."
          fi
